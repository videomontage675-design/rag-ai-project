# Golden set for the Dafira sample corpus.
#
# Schema (validated by tools/corpus/verify_corpus.py):
#   id               unique question id
#   category         single_doc | numeric_table | paraphrased | multi_doc |
#                    version_sensitive | unanswerable | out_of_scope
#   question         Arabic question as a user would ask it
#   expected_outcome answered | insufficient_information
#   reference_answer Arabic reference answer (for LLM-as-judge correctness)
#   evidence         list of supporting locations; each has:
#                      doc      logical document id (see manifest.yaml)
#                      version  optional; defaults to the version active in the state
#                      section  exact text of the enclosing "##" heading
#                      snippets short verbatim fragments (Markdown emphasis removed)
#                               that all occur in that section. A retrieved chunk
#                               counts as relevant if it comes from that document
#                               version and contains every snippet (after the
#                               system's normalization).
#   by_state         (version_sensitive only) per corpus state: expected_outcome,
#                    reference_answer, evidence
#   notes            optional remarks for evaluators
#
# Unless `by_state` is given, entries apply to manifest.default_state (d02_v2_active).

schema_version: 1
corpus_version: "1.0"

questions:

