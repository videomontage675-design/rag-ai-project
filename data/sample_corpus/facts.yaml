# Fact registry for the Dafira sample corpus.
#
# Every fact stated in more than one document (or that is version-sensitive)
# is listed once here, with the exact text that must appear in each document
# that states it. tools/corpus/verify_corpus.py checks every entry against the
# Markdown sources, so an edit that breaks cross-document consistency fails
# the check.
#
# Intentional differences exist only between the two versions of document 02
# (pricing v1 vs v2); they are marked `versioned: true`.
#
# Document 05 uses Arabic-Indic digits on purpose (normalization test), so its
# expected strings use those digits.

facts:
